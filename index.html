<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1a1a1a">
<title>Ruletka Pana Surowca</title>
<style>
  :root{
    --dark-bg:#1a1a1a; --gold:#d4af37; --green:#27ae60; --red:#e74c3c;
    --blood-red:#8a0303; --black-ui:#444; --wheel-black:#2c3e50;
    --white:#ecf0f1; --panel-bg:#222;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--dark-bg);color:var(--white);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;margin:0;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}
  #setup-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;z-index:1000}
  .modal{background:#222;padding:2rem;border:2px solid var(--gold);border-radius:15px;text-align:center;box-shadow:0 0 30px rgba(212,175,55,0.3);max-width:450px;width:90%}
  .modal h1{color:var(--gold);margin-bottom:1.5rem;font-size:1.8rem}
  .input-group{margin-bottom:15px;text-align:left}
  label{display:block;margin-bottom:5px;color:var(--gold);font-size:0.9rem}
  input{padding:10px;font-size:1rem;width:100%;box-sizing:border-box;border-radius:8px;border:1px solid var(--gold);background:#333;color:white}
  .btn-primary{padding:12px 30px;font-size:1.1rem;background:var(--gold);color:black;font-weight:bold;border:none;border-radius:8px;cursor:pointer;width:100%;margin-top:10px}
  #game-container{display:none;flex-direction:row;align-items:stretch;justify-content:space-between;width:100vw;height:100vh;padding:10px;box-sizing:border-box;gap:10px}
  #side-panel,#right-panel{width:280px;display:flex;flex-direction:column;gap:10px;height:100%}
  .info-card{background:var(--panel-bg);border:2px solid var(--gold);border-radius:12px;padding:15px;box-shadow:0 0 20px rgba(0,0,0,0.5)}
  .info-card h3{font-size:1rem;color:var(--gold);margin:0 0 10px 0;text-align:center;border-bottom:1px solid #444;padding-bottom:5px}
  .image-container{flex-grow:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:5px}
  .image-container img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  .stats-label{font-size:0.8rem;color:#aaa;margin-bottom:5px;display:block}
  .stats-values{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
  .stat-badge{padding:4px 8px;border-radius:4px;font-weight:bold;font-size:0.9rem;min-width:20px;text-align:center}
  .hot{background:var(--red);color:white}
  .cold{background:var(--black-ui);color:white;border:1px solid #666}
  #history-panel{flex-grow:1;background:var(--panel-bg);border:2px solid var(--gold);border-radius:12px;display:flex;flex-direction:column;padding:15px;box-shadow:0 0 20px rgba(0,0,0,0.5);overflow:hidden}
  #history-panel h2{font-size:1.2rem;color:var(--gold);margin-top:0;text-align:center;border-bottom:1px solid #444;padding-bottom:10px}
  #history-list{list-style:none;padding:0;margin:10px 0;overflow-y:auto;flex-grow:1}
  #history-list li{padding:8px;border-bottom:1px solid #333;text-align:center;font-weight:bold;font-size:1.1rem}
  .main-game{display:flex;flex-direction:column;align-items:center;justify-content:space-between;flex-grow:1;padding:10px 0;min-width:0}
  .game-header{text-align:center}
  .game-header h1{color:var(--gold);margin:0;font-size:2.5rem;text-transform:uppercase;letter-spacing:2px;text-shadow:0 0 15px rgba(212,175,55,0.4)}
  .game-header p{margin:2px 0 0 0;font-size:0.7rem;color:#888;letter-spacing:1px}
  .canvas-wrapper{position:relative;flex-grow:1;display:flex;align-items:center;justify-content:center;width:100%;max-height:70vh;overflow:visible}
  canvas{display:block;max-width:100%;max-height:100%;object-fit:contain}
  .controls-area{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;padding-bottom:10px}
  #result-display{font-size:1.8rem;font-weight:bold;color:var(--gold);text-shadow:2px 2px 4px rgba(0,0,0,0.5);text-align:center;min-height:2.2rem}
  .btn-spin{padding:15px 50px;font-size:1.4rem;background:var(--green);color:white;border:none;border-radius:50px;cursor:pointer;transition:all 0.2s;font-weight:bold;box-shadow:0 4px 15px rgba(39,174,96,0.4)}
  .btn-spin:disabled{background:#555;box-shadow:none}
  .btn-edit-side{background:#333;color:var(--gold);border:2px solid var(--gold);padding:10px;border-radius:10px;cursor:pointer;font-size:0.9rem;font-weight:bold;width:100%}
  .hist-red{color:var(--red)} .hist-black{color:#888} .hist-green{color:var(--green)}
  .perc-bar{background:#333;height:8px;border-radius:4px;overflow:hidden}
  .perc-bar>div{height:100%;transition:width 0.5s}
  @media (max-width:1100px){#side-panel,#right-panel{width:200px}.game-header h1{font-size:1.8rem}}
</style>
</head>
<body>

<div id="setup-overlay">
  <div class="modal">
    <h1>RULETKA PANA SUROWCA</h1>
    <div class="input-group">
      <label>Ilość ofiar:</label>
      <input type="number" id="numInput" min="1" max="50" placeholder="Ilość ofiar" value="20">
    </div>
    <div class="input-group">
      <label>Dodatkowe karne numery:</label>
      <input type="text" id="penaltyInput" placeholder="wpisz liczby po przecinku">
    </div>
    <button class="btn-primary" onclick="startGame()">Zatwierdź i Graj</button>
    <button id="closeEditBtn" class="btn-primary" style="display:none;background:#444;color:white;" onclick="hideSetup()">Anuluj</button>
  </div>
</div>

<div id="game-container">
  <div id="side-panel">
    <button class="btn-edit-side" onclick="showSetup(true)">⚙️ Edytuj numery</button>
    <div id="history-panel">
      <h2>Historia Ofiar</h2>
      <ul id="history-list"></ul>
    </div>
  </div>

  <div class="main-game">
    <header class="game-header">
      <h1>RULETKA PANA SUROWCA</h1>
      <p>AUTORSTWA MŁODEGO BIGCHOPPY</p>
    </header>
    <div class="canvas-wrapper">
      <canvas id="rouletteCanvas" width="900" height="900"></canvas>
    </div>
    <div class="controls-area">
      <div id="result-display">Wciśnij przycisk, aby zacząć!</div>
      <button id="spinBtn" class="btn-spin" onclick="startRolling()">PUŚĆ KULKĘ!</button>
    </div>
  </div>

  <div id="right-panel">
    <div class="info-card">
      <h3>Analiza Numerów</h3>
      <div style="margin-bottom:10px">
        <span class="stats-label">🔥 Gorące:</span>
        <div id="hot-numbers" class="stats-values"><span style="color:#666;font-size:0.8rem;">Brak danych</span></div>
      </div>
      <div>
        <span class="stats-label">❄️ Zimne:</span>
        <div id="cold-numbers" class="stats-values"><span style="color:#666;font-size:0.8rem;">Brak danych</span></div>
      </div>
    </div>
    <div class="info-card">
      <h3>Udział Kolorów</h3>
      <div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:4px;"><span>Zielony (0)</span><span id="perc-zero">0%</span></div>
        <div class="perc-bar"><div id="bar-zero" style="width:0%;background:var(--green);"></div></div>
      </div>
      <div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:4px;"><span>Czerwony</span><span id="perc-red">0%</span></div>
        <div class="perc-bar"><div id="bar-red" style="width:0%;background:var(--red);"></div></div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:4px;"><span>Czarny</span><span id="perc-black">0%</span></div>
        <div class="perc-bar"><div id="bar-black" style="width:0%;background:var(--black-ui);"></div></div>
      </div>
    </div>
    <div class="image-container">
      <img src="data:image/webp;base64,UklGRow7AABXRUJQVlA4IIA7AACw5gGdASrMAeACP5G40F84Lz+1KtJeI/AyCWNtfo9fLu52rev16fkzyEW94ZbrqW9tmA9stop3/4HhwYg1/3BLxn/Kvv1/xfL/2sf7f7D06rqP/w2Sfuf+l91+2X/486f3T/t85HzHv//O5/760cefqMHnv/71bffQFssFrEFI+VUuhxNlff3bqWkN+eva3PircfSFPbRW/TeGAna5bC32h5QI1NMD1nmIK/ffKBvdP5Z2bQpbo40PEDlgmQMbL/s/z5/eKEIwvKynRRm1r0kgHZbqoVGFeL5WLN9Ml1g5ETMs94DOsMjkjyil0BQCPlcldyPSEyzIBAmJbI8IdsWd9Yh25bUhhyui3/HFzOCXv6soD9jslhU5d8wYk9NIxkPd33tV4QfehC8wcAFEITzv+TPeld6HFyA+i+4dpV2pLSaE+hGTbxpH4lUzCPgpRXnUn64UdvwYOOpMtS/f7IcPTUv+pzp1EwZkXUhbMlL1osPQ1OhQAGioaoF4h8ccNWctqgYy7ybfHSemKWEGNjMdb6O9vih302L6jE1dkZLqUyeHGTghc4XeWo4mjfRoxRNpwWhaB6GTWJBG+u25rVOeNZxwIJmMsK0OiP+rsdJEip6uh9Mlx6gEuqEiF6jlkD2blbVsYMInmlQjXFHDkJbNsHG8R4ZZSS2Rj2B4TGlEeKpsxv36B5Ylcu3N1AOb7VHdd9AoY5tN3jWaiF91i18eCNGEjVeGf2SClhG0T3rwyvFJ39FssfGTzXzVHc8i6urTtZ16Ur8RyLdyApipEEzIWoDwChQz/c+QOqxfavld4RRfhZ+MdhBCyfacL4j+e9fa5QKljZEx37kqZr/yXw9BOEiu+am6C0WOHK3LBNHlvKWFFwmQdRvZy3mUHb7HReA2XsVtKFFZthRrY5/CldQEl6puad+QyAeTIGhw+s8H5t3umZpPLoJViE0F/NyYEVQJuszwial7/O/CdraeiGSLkI1sr0PfqNr/k/EBqni0fkFbaZiRpGUyO8gSAMpfDAaiauM646iim2Irk1hgyRdFlTQwBj0DZhV+sZWMU9s2MdqHj+1njvdyrrqjOmr6z/KT7f/4wyB81ivMKBisPKxbP+uh/k3WX7ehkbylnASpGgCeaeL0chYN3xjsrZJtzrpVZpeoj4gmdD8yFvBFmolK5E7ZkC6CGtWWwTcVmOkAr5LqOA8ttmIO6HZ6nkU6MSlU+rCMFeFXY+RF4S4UIUA9kyIxbzMyQlW/85vLtFelVvXuedbfAKFZkjV3dVxLZp6rDZnyAp1fa9L2drzP8u4pdSpRveWP0Ie6ozrp0Qs2MB7mwejZeI5jzgWPN6BAmBFZutlNfquCiP2vSNvxi4ExURrkeDVpahzqk6RhPSZ15pbJnVTSC7zxF/E8BgpkphymLwvs/prw+OW6u9ctOQzzGzniQ6QPImPLrzn+FX4kQE4feRq/qhUp7NjdyLcOnA5jBUxtoSfA0n2VlrDzjiIjsZHIp/nJNvw79m5urhZtixE5DrAWe1FVTcqNfrLvf66qUyCbv9rZcyiFs79HLIAhWmjfrcNjQ5Haqmy9+/KmXpX4JJAf2aFZTD05GSCz1KY+KCbwz/R9OtbFDcX+GLLfrqtvQvRsVo4hQzTzzIi5BfsWA+T1tFVHCG4LUjhMZVG+1NqPoXZhXf+ejUsiom7Acoq5WsliaGpam71W4sabb0frtJzeacD89z8qxs5Jk8upyp/w33XvsuyTFSuSGzyL3m7fL0lFrWG3MtGUWGzdIJihkn5eXbT+ULQZXlzhhqgjj6jcI+MJC9IVsEHhENVnno4w9lfJoFsXDbhGOkxxcncynBnt9UULBnCC7O+afFcclZQ3foBkO2WNdtLzutVA5lua2oSuxKYlPoOyNF4KZfCt2E9hDI/H+kpFqVyTudIf/ta/lTr9KdVcf <script>
(function(){
  'use strict';
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('rouletteCanvas');
  const ctx = canvas.getContext('2d');
  const resultDisplay = document.getElementById('result-display');
  const spinBtn = document.getElementById('spinBtn');
  const historyList = document.getElementById('history-list');
  const hotContainer = document.getElementById('hot-numbers');
  const coldContainer = document.getElementById('cold-numbers');

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playTick(){ const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type='sine'; o.frequency.setValueAtTime(800,audioCtx.currentTime); g.gain.setValueAtTime(0.1,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.05); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.05); }
  function playWin(){ /* no-op: self-contained, no mp3 */ }

  let numbers=[]; let fullHistory=[]; let isSpinning=false;
  let wheelAngle=0; const wheelSpeed=0.003;
  const outerRadius=380, innerRadius=150;
  const slotRadius=(outerRadius+innerRadius)/2;
  const edgeRadius=outerRadius+15;
  let ballAngle=-Math.PI/2; let ballRf=0.74;
  let lastTickSlot=-1;

  const cryptoObj=window.crypto||window.msCrypto; const randBuf=new Uint32Array(1);
  function randInt(max){ if(!max||max<1) return 0; if(cryptoObj&&cryptoObj.getRandomValues){ var limit=Math.floor(0x100000000/max)*max,x; do{cryptoObj.getRandomValues(randBuf);x=randBuf[0];}while(x>=limit); return x%max;} return Math.floor(Math.random()*max); }

  function showSetup(isEdit){ if(isEdit) document.getElementById('closeEditBtn').style.display='block'; document.getElementById('setup-overlay').style.display='flex'; }
  function hideSetup(){ document.getElementById('setup-overlay').style.display='none'; }
  function startGame(){
    const count=parseInt(document.getElementById('numInput').value);
    const penaltyRaw=document.getElementById('penaltyInput').value;
    numbers=[];
    if(!isNaN(count)&&count>=1){ numbers.push(0); for(let i=1;i<=count;i++) numbers.push(i); }
    else if(!isNaN(count)&&count===0){ numbers.push(0); }
    if(penaltyRaw.trim()!==""){
      const pens=penaltyRaw.split(',').map(n=>n.trim()).filter(n=>n!=="").map(n=>parseInt(n)).filter(n=>!isNaN(n));
      pens.forEach(p=>{ if(numbers.indexOf(p)===-1) numbers.push(p); });
    }
    if(numbers.length===0) return;
    fullHistory=[];
    wheelAngle=-(0.5)*(Math.PI*2/numbers.length);
    ballAngle=-Math.PI/2;
    resultDisplay.style.color="var(--gold)";
    resultDisplay.innerHTML="Wciśnij przycisk, aby zacząć!";
    hideSetup();
    document.getElementById('game-container').style.display='flex';
    if(!window.loopRunning){ window.loopRunning=true; requestAnimationFrame(gameLoop); }
    updateStats();
  }
  function colorType(num){ if(num===0) return 'green'; return num%2===1?'red':'black'; }

  function draw(){
    const centerX=canvas.width/2, centerY=canvas.height/2;
    const sliceAngle=(2*Math.PI)/numbers.length;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // rim
    ctx.beginPath(); ctx.arc(centerX,centerY,outerRadius+18,0,Math.PI*2); ctx.strokeStyle='#d4af37'; ctx.lineWidth=10; ctx.stroke();
    // slices
    numbers.forEach((num,i)=>{
      const angle=i*sliceAngle+wheelAngle-Math.PI/2;
      let color;
      if(num===0) color='#27ae60';
      else if(num%2===1) color='#c0392b';
      else color='#2c3e50';
      ctx.fillStyle=color;
      ctx.beginPath(); ctx.moveTo(centerX,centerY); ctx.arc(centerX,centerY,outerRadius,angle,angle+sliceAngle); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#d4af37'; ctx.lineWidth=1; ctx.stroke();
      ctx.save(); ctx.translate(centerX,centerY); ctx.rotate(angle+sliceAngle/2);
      ctx.fillStyle="white"; const fs=numbers.length>40?12:(numbers.length>20?16:22); ctx.font=`bold ${fs}px Arial`; ctx.textAlign="right"; ctx.fillText(num,outerRadius-15,fs/3); ctx.restore();
    });
    // inner hub
    ctx.beginPath(); ctx.arc(centerX,centerY,innerRadius,0,Math.PI*2); ctx.fillStyle='#111'; ctx.fill(); ctx.strokeStyle='#d4af37'; ctx.lineWidth=4; ctx.stroke();
    // ball fixed at pointer top, inside
    const r=slotRadius;
    const bx=centerX+Math.cos(-Math.PI/2)*r*0; // placeholder
    // draw ball at top inside
    const ballX=centerX, ballY=centerY- (innerRadius+ (outerRadius-innerRadius)*0.55);
    ctx.beginPath(); ctx.arc(ballX,ballY,11,0,Math.PI*2); ctx.fillStyle="#ffffff"; ctx.fill();
    // pointer
    ctx.beginPath(); ctx.moveTo(centerX, centerY-outerRadius-2); ctx.lineTo(centerX-12,centerY-outerRadius-28); ctx.lineTo(centerX+12,centerY-outerRadius-28); ctx.closePath(); ctx.fillStyle='#d4af37'; ctx.fill();
  }

  var spinState=null;
  function gameLoop(now){
    if(isSpinning && spinState){
      const sp=spinState;
      const t=Math.min(1,(now-sp.t0)/sp.dur);
      const ew=1-Math.pow(1-t,5);
      wheelAngle=sp.startWheel+(sp.targetWheel-sp.startWheel)*ew;
      const slice=(2*Math.PI)/numbers.length;
      const rel=(( -Math.PI/2 - wheelAngle + Math.PI/2)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
      const slot=Math.floor(rel/slice)%numbers.length;
      if(t<0.985 && slot!==lastTickSlot){ lastTickSlot=slot; playTick(); }
      if(t>=1){
        isSpinning=false; spinBtn.disabled=false;
        wheelAngle=sp.targetWheel;
        const norm=Math.floor(wheelAngle/(2*Math.PI))*2*Math.PI; wheelAngle-=norm;
        const num=numbers[sp.index];
        const type=colorType(num);
        fullHistory.push({num:num,type:type});
        if(num===0){ resultDisplay.style.color="var(--blood-red)"; resultDisplay.innerHTML="WYCIĄGAMY KARTECZKI!"; addToHistory("Kartkówka","hist-zero"); }
        else { resultDisplay.style.color="var(--gold)"; resultDisplay.innerHTML="Ofiara: "+num; addToHistory(num,type==="red"?"hist-red":"hist-black"); }
        updateStats();
        spinState=null;
      }
    } else if(!isSpinning) {
      wheelAngle+=0.003;
    }
    draw();
    requestAnimationFrame(gameLoop);
  }

  function startRolling(){
    if(isSpinning) return;
    if(audioCtx.state==='suspended') audioCtx.resume();
    isSpinning=true; spinBtn.disabled=true;
    resultDisplay.style.color="var(--gold)";
    resultDisplay.innerHTML="LOSOWANIE...";
    const n=numbers.length;
    const index=randInt(n);
    const slice=(2*Math.PI)/n;
    const jitter=(Math.random()-0.5)*slice*0.4;
    const finalMod=-(index+0.5)*slice+jitter;
    let delta=((finalMod-wheelAngle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
    const turns=5+Math.floor(Math.random()*2);
    const startWheel=wheelAngle;
    const targetWheel=wheelAngle+delta+turns*2*Math.PI;
    const dur=prefersReduced?900:5200+Math.floor(Math.random()*1300);
    const t0=performance.now();
    lastTickSlot=-1;
    spinState={index,startWheel,targetWheel,dur,t0};
    if(!window.loopRunning){ window.loopRunning=true; requestAnimationFrame(gameLoop); }
  }
  function addToHistory(val,className){ const li=document.createElement('li'); li.textContent=val==="Kartkówka"?val:`Nr ${val}`; li.className=className; historyList.prepend(li); }
  function updateStats(){
    if(fullHistory.length===0) return;
    const counts={}; numbers.forEach(n=>counts[n]=0);
    fullHistory.forEach(item=>counts[item.num]=(counts[item.num]||0)+1);
    const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const hot=sorted.filter(e=>e[1]>0).slice(0,3);
    const hotC=document.getElementById('hot-numbers'); hotC.innerHTML=hot.length?'':'<span style="color:#666;font-size:0.8rem;">Brak danych</span>';
    hot.forEach(([num])=>{const s=document.createElement('span');s.className='stat-badge hot';s.textContent=num;hotC.appendChild(s);});
    const cold=Object.entries(counts).sort((a,b)=>a[1]-b[1]).slice(0,3);
    const coldC=document.getElementById('cold-numbers'); coldC.innerHTML='';
    cold.forEach(([num])=>{const s=document.createElement('span');s.className='stat-badge cold';s.textContent=num;coldC.appendChild(s);});
    const total=fullHistory.length;
    const zC=fullHistory.filter(h=>h.type==="green").length;
    const rC=fullHistory.filter(h=>h.type==="red").length;
    const bC=fullHistory.filter(h=>h.type==="black").length;
    document.getElementById('perc-zero').textContent=Math.round((zC/total)*100)+"%";
    document.getElementById('perc-red').textContent=Math.round((rC/total)*100)+"%";
    document.getElementById('perc-black').textContent=Math.round((bC/total)*100)+"%";
    document.getElementById('bar-zero').style.width=(zC/total)*100+"%";
    document.getElementById('bar-red').style.width=(rC/total)*100+"%";
    document.getElementById('bar-black').style.width=(bC/total)*100+"%";
  }
  function showSetup(isEdit){ if(isEdit) document.getElementById('closeEditBtn').style.display='block'; document.getElementById('setup-overlay').style.display='flex'; }
  function hideSetup(){ document.getElementById('setup-overlay').style.display='none'; }
  window.startGame=startGame; window.showSetup=showSetup; window.hideSetup=hideSetup; window.startRolling=startRolling;
  // keyboard
  window.addEventListener('keydown',function(e){ if(e.code==='Space'||e.key===' '){ const g=document.getElementById('game-container'); if(g.style.display==='flex'){ e.preventDefault(); startRolling(); } } });
  // auto start if ? - no
})();
</script>
