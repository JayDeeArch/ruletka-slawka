<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0c0e">
<title>Ruletka Pana Surowca</title>
<style>
  :root{
    --bg:#0c0c0e;
    --surface:#141416;
    --surface-2:#1a1a1d;
    --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.16);
    --text:#f4f4f6;
    --muted:#8a8a93;
    --muted-2:#5a5a63;
    --accent:#d4b06a;
    --accent-soft:#e8d4a3;
    --red:#c6344a;
    --black:#2a2a2e;
    --radius:12px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100dvh;
    background:var(--bg);
    color:var(--text);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  h1,h2,h3,p,figure,ul{margin:0}
  button{font:inherit;color:inherit}
  [hidden]{display:none !important}
  :focus-visible{outline:1px solid var(--accent);outline-offset:3px}

  .screen{position:relative;z-index:1}

  /* ============ SETUP ============ */
  .setup-screen{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .setup-card{
    width:min(460px,100%);
    padding:36px 32px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--surface);
  }
  .setup-head{text-align:center;margin-bottom:32px}
  .monogram{
    width:44px;height:44px;
    margin:0 auto 18px;
    display:grid;place-items:center;
    border-radius:50%;
    border:1px solid var(--line-strong);
    color:var(--accent);
    font-family:Georgia,"Times New Roman",serif;
    font-size:1.05rem;
    letter-spacing:.05em;
  }
  .eyebrow{
    margin:0 0 10px;
    font-size:.62rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--muted-2);
  }
  .display{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:600;
    text-transform:uppercase;
    line-height:.98;
    letter-spacing:.02em;
    font-size:clamp(2.1rem,6vw,2.8rem);
    color:var(--text);
  }
  .display .accent{color:var(--accent)}

  #setupForm{margin-top:8px}
  .field{margin-bottom:20px}
  .field label{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    margin-bottom:8px;
    font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  }
  .field label span{font-size:.62rem;letter-spacing:.04em;text-transform:none;color:var(--muted-2)}
  .stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px}
  .step-btn{
    border-radius:8px;border:1px solid var(--line);background:transparent;
    color:var(--muted);font-size:1.2rem;cursor:pointer;transition:all .15s;
  }
  .step-btn:hover{color:var(--text);border-color:var(--line-strong);background:var(--surface-2)}
  input{
    width:100%;padding:12px 14px;border-radius:8px;
    border:1px solid var(--line);background:var(--surface-2);color:var(--text);
    font-family:inherit;font-size:1rem;transition:border-color .15s;
  }
  input::placeholder{color:var(--muted-2)}
  input:focus{outline:none;border-color:var(--accent)}
  input[type=number]{text-align:center;font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .presets{display:flex;gap:6px;margin-top:8px}
  .preset{
    flex:1;padding:7px 4px;border-radius:6px;border:1px solid var(--line);
    background:transparent;color:var(--muted);font-size:.68rem;font-weight:600;cursor:pointer;transition:all .15s;
  }
  .preset:hover{color:var(--text);border-color:var(--line-strong);background:var(--surface-2)}
  .hint{margin-top:8px;font-size:.66rem;line-height:1.5;color:var(--muted-2)}
  .error{
    margin:0 0 14px;padding:10px 12px;border-radius:8px;
    border:1px solid rgba(198,52,74,.35);background:rgba(198,52,74,.08);
    color:#ff9aaa;font-size:.76rem;line-height:1.45;
  }
  .cta{
    width:100%;padding:14px 20px;border:0;border-radius:8px;
    background:var(--accent);color:#1a1407;
    font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
    transition:filter .15s,transform .15s;
  }
  .cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .cta:active{transform:translateY(0)}
  .ghost{
    width:100%;margin-top:10px;padding:12px;border-radius:8px;
    border:1px solid var(--line);background:transparent;color:var(--muted);
    font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .15s;
  }
  .ghost:hover{color:var(--text);border-color:var(--line-strong)}

  /* ============ GAME ============ */
  .game-screen{
    height:100dvh;display:flex;flex-direction:column;
    padding:14px clamp(12px,2vw,24px) 18px;overflow:hidden;
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:2px 2px 14px;border-bottom:1px solid var(--line);
  }
  .brand-mini{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-mini .monogram{width:34px;height:34px;font-size:.85rem;margin:0}
  .brand-mini h1{
    font-family:Georgia,"Times New Roman",serif;font-size:1rem;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;color:var(--text);
  }
  .toolbar{display:flex;gap:6px;flex:none}
  .tool{
    display:inline-flex;align-items:center;gap:6px;padding:8px 11px;
    border-radius:8px;border:1px solid var(--line);background:transparent;
    color:var(--muted);font-size:.66rem;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:all .15s;
  }
  .tool:hover{color:var(--text);border-color:var(--line-strong);background:var(--surface-2)}
  .tool svg{width:14px;height:14px;flex:none}
  .tool .icon-off{display:none}
  .tool.is-muted .icon-on{display:none}
  .tool.is-muted .icon-off{display:block}

  .layout{
    flex:1;min-height:0;display:grid;
    grid-template-columns:minmax(190px,230px) minmax(0,1fr) minmax(280px,360px);
    gap:16px;align-items:stretch;
  }
  .panel{
    border-radius:var(--radius);border:1px solid var(--line);
    background:var(--surface);
  }
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px 10px;border-bottom:1px solid var(--line);
  }
  .panel-head h2{
    font-size:.6rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  }
  .count{font-size:.6rem;color:var(--muted-2);font-variant-numeric:tabular-nums}

  .history-panel{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .history-list{
    list-style:none;margin:0;padding:8px 10px 10px;
    display:flex;flex-direction:column;gap:4px;
    overflow-y:auto;overscroll-behavior:contain;flex:1;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  .history-list::-webkit-scrollbar{width:4px}
  .history-list::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px}
  .history-list li{
    display:flex;align-items:center;gap:9px;padding:7px 9px;
    border-radius:6px;border:1px solid var(--line);background:var(--surface-2);
    animation:slideIn .25s ease;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  li.red .dot{background:var(--red)}
  li.black .dot{background:var(--black);border:1px solid var(--line-strong)}
  li.green .dot{background:#2e9e6b}
  .hist-label{font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap}
  .hist-tag{margin-left:auto;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);white-space:nowrap}
  .hist-seq{font-size:.54rem;color:var(--muted-2);font-variant-numeric:tabular-nums}
  .empty{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:24px 20px;text-align:center;font-size:.7rem;line-height:1.6;color:var(--muted-2);
  }

  .stage{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;min-height:0;min-width:0;padding:2px 0;
  }
  .wheel-wrap{
    position:relative;width:min(640px,66vmin,calc(100dvh - 280px));
    aspect-ratio:1/1;flex:none;
  }
  .wheel-wrap canvas{display:block;width:100%;height:100%}
  .flash{
    position:absolute;inset:-4%;border-radius:50%;pointer-events:none;opacity:0;
    background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%);
  }
  .flash.show{animation:land .7s ease-out}
  @keyframes land{0%{opacity:0;transform:scale(.84)}16%{opacity:1}100%{opacity:0;transform:scale(1.1)}}

  .result{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-height:74px;justify-content:center}
  .result-label{font-size:.54rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted-2)}
  .result-text{
    font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.45rem,3vw,2.1rem);
    line-height:1.1;color:var(--text);min-height:1.15em;
  }
  .result-text .num{color:var(--accent)}
  .result-text.spinning{color:var(--muted);font-style:italic}
  .result-text.pop{animation:pop .4s ease}
  @keyframes pop{0%{opacity:.2;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
  .result-meta{font-size:.64rem;color:var(--muted-2);min-height:1em}

  .spin{
    display:inline-flex;align-items:center;gap:10px;padding:13px 30px;
    border-radius:8px;border:1px solid var(--line-strong);
    background:var(--accent);color:#1a1407;
    font-size:.76rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
    transition:filter .15s,transform .15s;
  }
  .spin:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
  .spin:active:not(:disabled){transform:translateY(0)}
  .spin:disabled{cursor:not-allowed;filter:grayscale(.5) brightness(.7)}
  .spin kbd{
    padding:2px 6px;border-radius:4px;border:1px solid rgba(0,0,0,.25);
    background:rgba(0,0,0,.18);font-size:.52rem;font-weight:600;color:rgba(26,20,7,.7);
  }

  /* right column */
  .right-col{height:100%;min-height:0;overflow:hidden;border-radius:var(--radius)}
  .portrait{width:100%;height:100%;overflow:hidden;background:var(--surface)}
  .portrait img{
    display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%;
    filter:grayscale(.08);transition:filter .3s;
  }
  .portrait:hover img{filter:grayscale(0)}

  .toast{
    position:fixed;left:24px;bottom:24px;z-index:60;
    transform:translateY(16px);padding:10px 16px;border-radius:8px;
    border:1px solid var(--line);background:var(--surface);color:var(--text);
    font-size:.7rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    white-space:nowrap;max-width:calc(100vw - 48px);overflow:hidden;text-overflow:ellipsis;
  }
  .toast.show{opacity:1;transform:translateY(0)}

  /* responsive */
  @media (max-width:1180px){
    .layout{grid-template-columns:minmax(170px,200px) minmax(0,1fr) minmax(240px,300px)}
    .brand-mini h1{font-size:.9rem}
    .wheel-wrap{width:min(560px,60vmin,calc(100dvh - 270px))}
  }
  @media (max-width:980px){
    .game-screen{height:auto;min-height:100dvh;overflow:visible;padding:12px}
    .layout{display:flex;flex-direction:column;gap:12px}
    .stage{order:1;width:100%;padding-top:4px}
    .wheel-wrap{width:min(90vw,460px);max-width:100%}
    .right-col{order:2;height:min(62vh,560px);overflow:visible;border-radius:var(--radius)}
    .history-panel{order:3;width:100%;max-height:none;min-height:0}
    .history-list{max-height:280px;flex:none}
    .empty{padding:24px}
    .topbar{padding-bottom:12px}
  }
  @media (max-width:640px){
    .topbar{gap:10px}
    .brand-mini{gap:9px}
    .brand-mini h1{font-size:.82rem;letter-spacing:.05em}
    .medallion.small{width:32px;height:32px;font-size:.75rem}
    .tool{padding:8px;width:36px;height:36px;justify-content:center}
    .tool span{display:none}
    .wheel-wrap{width:min(92vw,400px)}
    .result{min-height:70px}
    .spin{padding:12px 24px;font-size:.72rem;letter-spacing:.12em}
    .spin kbd{display:none}
    .right-col{height:min(58vh,480px)}
    .layout{gap:10px}
    .field{margin-bottom:18px}
    .preset{font-size:.62rem}
  }
  @media (max-height:720px) and (min-width:981px){
    .wheel-wrap{width:min(560px,60vmin,calc(100dvh - 250px))}
    .topbar{padding-bottom:8px}
    .result{min-height:68px}
    .spin{padding:11px 24px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>

<section id="setupScreen" class="screen setup-screen">
  <div class="setup-card">
    <div class="setup-head">
      <div class="monogram" aria-hidden="true">PS</div>
      <p class="eyebrow">Losowanie ofiar</p>
      <h1 class="display">Ruletka<br><span class="accent">Pana Surowca</span></h1>
    </div>
    <form id="setupForm" novalidate>
      <div class="field">
        <label for="victimsInput">Ilość ofiar <span>1–100</span></label>
        <input id="victimsInput" type="number" inputmode="numeric" min="1" max="100" step="1" value="20" autocomplete="off">
      </div>
      <div class="field">
        <label for="penaltiesInput">Dodatkowe karne numery <span>opcjonalnie</span></label>
        <input id="penaltiesInput" type="text" placeholder="np. 13, 21, 66" autocomplete="off" spellcheck="false">
        <p class="hint">Numery spoza zakresu 1–N. Duplikaty pomijane.</p>
      </div>
      <p class="error" id="setupError" role="alert" hidden></p>
      <button type="submit" class="cta">Zatwierdź i graj</button>
    </form>
  </div>
</section>

<section id="gameScreen" class="screen game-screen" hidden>
  <header class="topbar">
    <div class="toolbar">
      <button class="tool" id="soundBtn" type="button" aria-pressed="true" title="Wycisz dźwięk">
        <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
        <span>Dźwięk</span>
      </button>
      <button class="tool" id="editBtn" type="button" title="Zmień zakres">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Edytuj</span>
      </button>
      <button class="tool" id="resetBtn" type="button" title="Wyczyść historię">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Reset</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="panel history-panel">
      <div class="panel-head">
        <h2>Historia</h2>
        <span class="count" id="historyCount">0</span>
      </div>
      <ul class="history-list" id="historyList"></ul>
      <p class="empty" id="historyEmpty">Brak losowań.<br>Puść kulkę.</p>
    </aside>

    <main class="stage">
      <div class="wheel-wrap" id="wheelWrap">
        <canvas id="wheel" aria-hidden="true"></canvas>
        <div class="flash" id="flash" aria-hidden="true"></div>
      </div>
      <div class="result" aria-live="polite" aria-atomic="true">
        <div class="result-text" id="resultText">Gotowi?</div>
      </div>
      <button type="button" class="spin" id="spinBtn">
        <span id="spinLabel">Puść kulkę</span>
        <kbd>Space</kbd>
      </button>
    </main>

    <aside class="right-col">

<script>
(function () {
  'use strict';
  var TAU = Math.PI * 2;
  var SETUP_KEY = 'ruletka-surowiec:config:v3';
  var SOUND_KEY = 'ruletka-surowiec:sound:v3';
  var MAX_NUMBERS = 120;
  var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function $(sel, root) { return (root || document).querySelector(sel); }
  function clamp(v, min, max) { return v < min ? min : (v > max ? max : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }

  var els = {
    setupScreen: $('#setupScreen'), gameScreen: $('#gameScreen'), setupForm: $('#setupForm'),
    victims: $('#victimsInput'), penalties: $('#penaltiesInput'), setupError: $('#setupError'),
    canvas: $('#wheel'), wheelWrap: $('#wheelWrap'), flash: $('#flash'),
    resultText: $('#resultText'), spinBtn: $('#spinBtn'), spinLabel: $('#spinLabel'),
    historyList: $('#historyList'), historyEmpty: $('#historyEmpty'), historyCount: $('#historyCount'),
    soundBtn: $('#soundBtn'), editBtn: $('#editBtn'), resetBtn: $('#resetBtn'), toast: $('#toast')
  };

  var state = {
    config: { count: 20, penalties: [] }, numbers: [], history: [], slice: TAU,
    size: 0, dpr: 1, R: 0, wheelAngle: 0, ballAngle: -Math.PI / 2,
    spinning: false, pending: -1, spinStart: 0, spinDur: 0, startWheel: 0, targetWheel: 0,
    lastTickSlot: -1, lastTickAt: 0, p: 0, wheelLayer: null, raf: 0
  };

  var cryptoObj = window.crypto || window.msCrypto;
  var randBuf = new Uint32Array(1);
  function randInt(max) {
    if (!Number.isInteger(max) || max <= 0) return 0;
    if (cryptoObj && cryptoObj.getRandomValues) {
      var limit = Math.floor(0x100000000 / max) * max, x;
      do { cryptoObj.getRandomValues(randBuf); x = randBuf[0]; } while (x >= limit);
      return x % max;
    }
    return Math.floor(Math.random() * max);
  }
  function randFloat() {
    if (cryptoObj && cryptoObj.getRandomValues) { cryptoObj.getRandomValues(randBuf); return randBuf[0] / 0x100000000; }
    return Math.random();
  }
  function colorType(num) { if (num === 0) return 'green'; return num % 2 === 1 ? 'red' : 'black'; }
  function plural(n, one, few, many) {
    if (n === 1) return one;
    var d = n % 10, h = n % 100;
    if (d >= 2 && d <= 4 && (h < 12 || h > 14)) return few;
    return many;
  }

  /* sound */
  var soundOn = true, actx = null;
  function ensureAudio() {
    if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; try { actx = new AC(); } catch (e) { actx = null; return; } }
    if (actx.state === 'suspended') actx.resume().catch(function () {});
  }
  function tick(volume) {
    if (!soundOn || !actx) return;
    var t = actx.currentTime;
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(800, t);
    g.gain.setValueAtTime(0.1, t);
    g.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
    o.connect(g);
    g.connect(actx.destination);
    o.start(t);
    o.stop(t + 0.05);
  }
  function playWin() {
    if (!soundOn) return; ensureAudio(); if (!actx) return;
    var start = actx.currentTime + 0.04, step = 0.1, notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach(function (freq, i) {
      var t = start + i * step;
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.08, t + 0.025); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.75);
    });
  }
  function setSound(on, persist) {
    soundOn = !!on;
    els.soundBtn.setAttribute('aria-pressed', String(soundOn));
    els.soundBtn.title = soundOn ? 'Wycisz dźwięk' : 'Włącz dźwięk';
    els.soundBtn.classList.toggle('is-muted', !soundOn);
    if (persist) try { localStorage.setItem(SOUND_KEY, soundOn ? '1' : '0'); } catch (e) {}
  }
  function toggleSound() {
    setSound(!soundOn, true);
    if (soundOn) { ensureAudio(); tick(1); toast('Dźwięk włączony'); } else toast('Dźwięk wyciszony');
  }

  /* setup */
  function showError(message) { els.setupError.textContent = message; els.setupError.hidden = false; }
  function readSetup() {
    var count = Number(els.victims.value);
    if (!Number.isInteger(count) || count < 1 || count > 100) return { error: 'Podaj liczbę ofiar od 1 do 100.' };
    var raw = els.penalties.value.trim();
    var tokens = raw ? raw.split(/[\s,;]+/).filter(Boolean) : [];
    var penalties = [], bad = [];
    tokens.forEach(function (token) {
      var n = Number(token);
      if (!Number.isInteger(n) || n < 0 || n > 999) bad.push(token);
      else if (n !== 0 && penalties.indexOf(n) === -1) penalties.push(n);
    });
    if (bad.length) return { error: 'Nieprawidłowe numery: ' + bad.slice(0, 6).join(', ') + '. Podaj liczby całkowite 0–999.' };
    var numbers = [0];
    for (var i = 1; i <= count; i++) numbers.push(i);
    penalties.forEach(function (n) { if (numbers.indexOf(n) === -1) numbers.push(n); });
    if (numbers.length > MAX_NUMBERS) return { error: 'Za dużo numerów w kole (maks. ' + MAX_NUMBERS + ').' };
    return { count: count, penalties: penalties, numbers: numbers };
  }
  function saveConfig() {
    try { localStorage.setItem(SETUP_KEY, JSON.stringify({ count: state.config.count, penalties: state.config.penalties })); } catch (e) {}
  }
  function loadConfig() {
    try {
      var raw = localStorage.getItem(SETUP_KEY);
      if (!raw) return null;
      var cfg = JSON.parse(raw);
      if (!cfg || !Number.isInteger(cfg.count) || cfg.count < 1 || cfg.count > 100) return null;
      if (!Array.isArray(cfg.penalties)) cfg.penalties = [];
      cfg.penalties = cfg.penalties.filter(function (n) { return Number.isInteger(n) && n >= 1 && n <= 999; });
      return cfg;
    } catch (e) { return null; }
  }
  function applyConfig(result) {
    state.config = { count: result.count, penalties: result.penalties };
    state.numbers = result.numbers.slice();
    state.slice = TAU / state.numbers.length;
    saveConfig();
    els.victims.value = result.count;
    els.penalties.value = result.penalties.join(', ');
    els.setupError.hidden = true;
    els.setupScreen.hidden = true;
    els.gameScreen.hidden = false;
    resetSession();
    startLoop();
    requestAnimationFrame(function () { resizeCanvas(); draw(performance.now()); });
    toast('Koło gotowe · ' + state.numbers.length + ' ' + plural(state.numbers.length, 'numer', 'numery', 'numerów'));
  }
  function openSetup(editing) {
    stopLoop();
    els.gameScreen.hidden = true; els.setupScreen.hidden = false;
    if (editing) { els.victims.value = state.config.count; els.penalties.value = state.config.penalties.join(', '); }
  }
  function cancelEdit() {
    if (!state.numbers.length) return;
    els.setupScreen.hidden = true; els.gameScreen.hidden = false;
    startLoop();
    requestAnimationFrame(function () { resizeCanvas(); draw(performance.now()); });
  }
  function resetSession() {
    state.history = []; state.spinning = false;
    state.ballAngle = -Math.PI / 2; state.wheelAngle = -0.5 * state.slice;
    state.pending = -1; state.lastTickSlot = -1; state.p = 0;
    els.historyList.innerHTML = ''; els.historyEmpty.hidden = false;
    els.historyCount.textContent = '0'; els.spinBtn.disabled = false;
    els.spinLabel.textContent = 'Puść kulkę'; els.wheelWrap.classList.remove('spinning');
    setIdle();
  }
  function setIdle() {
    var n = state.numbers.length;
    els.resultText.className = 'result-text'; els.resultText.textContent = 'Gotowi?';
    draw(performance.now());
  }

  /* history */
  function addHistory(num, type, seq) {
    var li = document.createElement('li'); li.className = type;
    var dot = document.createElement('span'); dot.className = 'dot';
    var label = document.createElement('span'); label.className = 'hist-label'; label.textContent = 'Nr ' + num;
    var tag = document.createElement('span'); tag.className = 'hist-tag'; tag.textContent = type === 'red' ? 'czerwony' : (type === 'green' ? 'zielony' : 'czarny');
    var seqEl = document.createElement('span'); seqEl.className = 'hist-seq'; seqEl.textContent = '#' + seq;
    li.appendChild(dot); li.appendChild(label); li.appendChild(tag); li.appendChild(seqEl);
    els.historyList.prepend(li);
    while (els.historyList.children.length > 60) els.historyList.lastElementChild.remove();
    els.historyEmpty.hidden = true;
    els.historyCount.textContent = String(state.history.length);
  }

  /* wheel canvas */
  var ctx = els.canvas.getContext('2d');
  function resizeCanvas() {
    if (els.gameScreen.hidden) return;
    var rect = els.wheelWrap.getBoundingClientRect();
    var w = Math.floor(rect.width);
    if (w < 40) return;
    state.size = w; state.dpr = Math.min(window.devicePixelRatio || 1, 2); state.R = w * 0.405;
    var px = Math.round(w * state.dpr);
    if (els.canvas.width !== px || els.canvas.height !== px) { els.canvas.width = px; els.canvas.height = px; }
    buildWheel();
  }
  function buildWheel() {
    var size = state.size;
    if (!size || !state.numbers.length) return;
    var layer = state.wheelLayer || (state.wheelLayer = document.createElement('canvas'));
    layer.width = els.canvas.width; layer.height = els.canvas.height;
    var g = layer.getContext('2d');
    g.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    g.clearRect(0, 0, size, size);
    drawWheel(g, size);
  }
  function drawWheel(g, S) {
    var cx = S / 2, cy = S / 2, R = S * 0.405;
    var n = state.numbers.length, slice = TAU / n;
    g.save(); g.translate(cx, cy);
    /* rim */
    g.beginPath(); g.arc(0, 0, R * 1.04, 0, TAU);
    var rim = g.createLinearGradient(-R, -R, R, R);
    rim.addColorStop(0, '#2a2a2e'); rim.addColorStop(0.5, '#1a1a1d'); rim.addColorStop(1, '#2a2a2e');
    g.fillStyle = rim; g.fill();
    g.lineWidth = Math.max(1, S * 0.0014); g.strokeStyle = 'rgba(255,255,255,.1)'; g.stroke();
    g.beginPath(); g.arc(0, 0, R * 1.01, 0, TAU);
    g.strokeStyle = 'rgba(212,176,106,.35)'; g.lineWidth = Math.max(0.8, S * 0.001); g.stroke();
    /* slices */
    g.save();
    g.beginPath(); g.arc(0, 0, R * 0.99, 0, TAU); g.clip();
    for (var i = 0; i < n; i++) {
      var start = i * slice - Math.PI / 2;
      var color = (state.numbers[i] === 0) ? '#0e7a4e' : (state.numbers[i] % 2 === 1 ? '#c6344a' : '#1c1c1e');
      g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R * 0.99, start, start + slice); g.closePath();
      g.fillStyle = color; g.fill();
    }
    g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = Math.max(0.5, S * 0.001);
    for (var s = 0; s < n; s++) {
      var sa = s * slice - Math.PI / 2;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(sa) * R * 0.99, Math.sin(sa) * R * 0.99); g.stroke();
    }
    var depth = g.createRadialGradient(0, 0, R * 0.2, 0, 0, R);
    depth.addColorStop(0, 'rgba(0,0,0,0)'); depth.addColorStop(1, 'rgba(0,0,0,.35)');
    g.fillStyle = depth; g.beginPath(); g.arc(0, 0, R * 0.99, 0, TAU); g.fill();
    g.restore();
    /* numbers */
    var midR = R * 0.85;
    var chord = 2 * midR * Math.sin(slice / 2);
    var fontSize = clamp(chord * 0.6, 7, 24);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '600 ' + fontSize.toFixed(2) + 'px "Segoe UI", system-ui, Arial, sans-serif';
    for (var j = 0; j < n; j++) {
      var label = String(state.numbers[j]);
      var angle = j * slice - Math.PI / 2 + slice / 2;
      g.save(); g.rotate(angle);
      g.fillStyle = 'rgba(0,0,0,.45)'; g.fillText(label, midR + 0.8, 0.8);
      g.fillStyle = '#f2f2f4'; g.fillText(label, midR, 0);
      g.restore();
    }
    g.restore();
  }
  function drawHub(g, S) {
    var R = state.R, hubR = R * 0.3;
    g.save();
    g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = S * 0.018; g.shadowOffsetY = S * 0.005;
    g.beginPath(); g.arc(0, 0, hubR, 0, TAU);
    var hub = g.createRadialGradient(-hubR * 0.3, -hubR * 0.4, hubR * 0.1, 0, 0, hubR);
    hub.addColorStop(0, '#2a2a2e'); hub.addColorStop(1, '#0e0e10');
    g.fillStyle = hub; g.fill(); g.restore();
    g.beginPath(); g.arc(0, 0, hubR, 0, TAU);
    g.strokeStyle = 'rgba(212,176,106,.4)'; g.lineWidth = Math.max(1, R * 0.01); g.stroke();
  }
  function drawPointer(g, S) {
    var cx = S / 2, cy = S / 2, R = state.R;
    var tipY = cy - R * 1.02, baseY = cy - R * 1.12, half = S * 0.026;
    g.save(); g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = S * 0.012;
    g.beginPath(); g.moveTo(cx, tipY); g.lineTo(cx - half, baseY); g.lineTo(cx + half, baseY); g.closePath();
    g.fillStyle = '#d4b06a'; g.fill(); g.restore();
  }
  function draw(now) {
    var S = state.size; if (!S) return;
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    ctx.clearRect(0, 0, S, S);
    var cx = S / 2, cy = S / 2;
    if (state.wheelLayer) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(state.wheelAngle);
      ctx.drawImage(state.wheelLayer, -S / 2, -S / 2, S, S); ctx.restore();
    }
    ctx.save(); ctx.translate(cx, cy); drawHub(ctx, S); ctx.restore();
    drawPointer(ctx, S);
  }

  /* spin */
  function spin() {
    if (state.spinning || !state.numbers.length) return;
    ensureAudio();
    var n = state.numbers.length, slice = state.slice;
    var index = randInt(n);
    var jitter = (randFloat() - 0.5) * slice * 0.45;
    var finalMod = -(index + 0.5) * slice + jitter;
    var delta = ((finalMod - state.wheelAngle) % TAU + TAU) % TAU;
    var turns = 6 + randInt(2);
    state.pending = index;
    state.startWheel = state.wheelAngle;
    state.targetWheel = state.wheelAngle + delta + turns * TAU;
    state.spinDur = prefersReduced ? 900 : 5400 + randInt(1200);
    state.spinStart = performance.now();
    state.spinning = true;
    state.lastTickSlot = -1; state.lastTickAt = 0; state.p = 0;
    els.spinBtn.disabled = true; els.spinLabel.textContent = 'Losujemy…';
    els.spinBtn.setAttribute('aria-busy', 'true');
    els.wheelWrap.classList.add('spinning');
    els.resultText.className = 'result-text spinning'; els.resultText.textContent = 'Losowanie…';
    startLoop();
  }
  function step(now) {
    if (!state.spinning) return;
    var t = clamp((now - state.spinStart) / state.spinDur, 0, 1);
    state.p = t;
    var ew = easeOutQuint(t);
    state.wheelAngle = state.startWheel + (state.targetWheel - state.startWheel) * ew;
    var rel = ((state.ballAngle - state.wheelAngle + Math.PI / 2) % TAU + TAU) % TAU;
    var slot = Math.floor(rel / state.slice) % state.numbers.length;
    if (t < 0.985 && slot !== state.lastTickSlot && now - state.lastTickAt > 40) {
      state.lastTickSlot = slot; state.lastTickAt = now; tick(0.35 + 0.65 * (1 - t));
    }
    if (t >= 1) finishSpin();
  }
  function finishSpin() {
    state.spinning = false; state.p = 1;
    state.wheelAngle = state.targetWheel;
    var norm = Math.floor(state.wheelAngle / TAU) * TAU;
    state.wheelAngle -= norm;
    var index = state.pending, num = state.numbers[index], type = colorType(num);
    state.history.push({ num: num, type: type, index: index });
    addHistory(num, type, state.history.length);
    els.resultText.className = 'result-text';
    els.resultText.innerHTML = 'Ofiara <span class="num">' + num + '</span>';
    els.resultText.classList.remove('pop'); void els.resultText.offsetWidth; els.resultText.classList.add('pop');
    els.flash.classList.remove('show'); void els.flash.offsetWidth; els.flash.classList.add('show');
    els.spinBtn.disabled = false; els.spinBtn.removeAttribute('aria-busy');
    els.spinLabel.textContent = 'Puść kulkę'; els.wheelWrap.classList.remove('spinning');
    playWin();
  }

  /* main loop */
  function frame(now) { step(now); draw(now); state.raf = requestAnimationFrame(frame); }
  function startLoop() { if (state.raf) return; state.raf = requestAnimationFrame(frame); }
  function stopLoop() { if (!state.raf) return; cancelAnimationFrame(state.raf); state.raf = 0; }

  /* toast */
  var toastTimer = 0;
  function toast(message) {
    els.toast.textContent = message; els.toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { els.toast.classList.remove('show'); }, 2200);
  }

  /* events */
  els.setupForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var result = readSetup();
    if (result.error) { showError(result.error); return; }
    els.setupError.hidden = true; applyConfig(result);
  });
  els.spinBtn.addEventListener('click', spin);
  els.soundBtn.addEventListener('click', toggleSound);
  els.editBtn.addEventListener('click', function () { openSetup(true); });
  els.resetBtn.addEventListener('click', function () {
    if (!state.numbers.length) return; resetSession(); toast('Wyczyszczono historię');
  });
  window.addEventListener('keydown', function (e) {
    if (els.gameScreen.hidden) return;
    if (e.code !== 'Space' && e.key !== ' ') return;
    if (e.target.closest('input, textarea, select, button')) return;
    e.preventDefault(); spin();
  });
  if ('ResizeObserver' in window) {
    var ro = new ResizeObserver(function () { if (els.gameScreen.hidden) return; resizeCanvas(); draw(performance.now()); });
    ro.observe(els.wheelWrap);
  } else {
    window.addEventListener('resize', function () { if (els.gameScreen.hidden) return; resizeCanvas(); draw(performance.now()); });
  }
  window.addEventListener('orientationchange', function () { setTimeout(function () { if (els.gameScreen.hidden) return; resizeCanvas(); draw(performance.now()); }, 180); });

  /* init */
  var stored = loadConfig();
  if (stored) { els.victims.value = String(stored.count); els.penalties.value = stored.penalties.join(', '); }
  var storedSound = null;
  try { storedSound = localStorage.getItem(SOUND_KEY); } catch (e) {}
  setSound(storedSound === null ? true : storedSound === '1', false);
})();
</script>
</body>
</html>
